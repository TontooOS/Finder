[package]
name = "finder"
version = "0.1.0"
edition = "2021"
description = "Finder for TontooOS"
readme = "README.md"

[[bin]]
name = "finder"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "UIKit", "CoreIcon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
